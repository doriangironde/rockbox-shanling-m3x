name: Publish web installer

on:
  push:
    branches: [main]
    paths:
      - 'web-installer/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-installer/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci --ignore-scripts
        working-directory: web-installer
      - run: npm test
        working-directory: web-installer
      - run: npm run build
        working-directory: web-installer
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web-installer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
